<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="description" content="A minimal blog card showcasing the ultimate guide to minimalism.">
  <title>Minimal Blog Card</title>
  <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <div class="card">
        <img src="imagens/Cactus.jpg" alt="Blog Image" class="card-image" width="336" height="152">
        <div class="card-content">
          <span class="tag">Design</span>
          <h2 class="card-title">Embracing Minimalism</h2>
          <p class="card-description">From minimalist sculptures to minimalist paintings, this blog will inspire you to appreciate the beauty that lies in simplicity.</p>
        </div>

        <div class="card-footer">
          <div class="author">Bia Cezar</div>
          <div class="footer-links">
            <a href="https://github.com/Biacezar" target="_blank" class="btn">Conheça oa programadora</a>
            <a href="https://www.devchallenges.io?ref=challenge" target="_blank" class="btn">devChallenges.io</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
